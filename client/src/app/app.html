<mat-sidenav-container class="h-screen">
  <!-- Vertical Sidebar -->
  <mat-sidenav mode="side" opened
    class="!w-22 border-r border-slate-200 p-4 !bg-[var(--mat-sys-primary-container)] !text-[var(--mat-sys-primary)]">
    <mat-nav-list class="flex flex-col gap-4">
      <a mat-list-item routerLink="/sales" routerLinkActive="active-link">
        <mat-icon matListItemIcon>point_of_sale</mat-icon>
      </a>

      <a mat-list-item routerLink="/exchange" routerLinkActive="active-link">
        <mat-icon matListItemIcon>currency_exchange</mat-icon>
      </a>

      <a mat-list-item routerLink="/history" routerLinkActive="active-link">
        <mat-icon matListItemIcon>bar_chart</mat-icon>
      </a>

      <a mat-list-item routerLink="/users" routerLinkActive="active-link">
        <mat-icon matListItemIcon>account_circle</mat-icon>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Main Content Area -->
  <mat-sidenav-content class="p-8 bg-slate-50 flex items-center justify-center">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
