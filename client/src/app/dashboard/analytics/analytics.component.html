<div class="md:p-4 p-0 min-h-screen">
  <!-- Tailwind Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 md:gap-2 gap-1">
    <!-- Card 1: Sales by Currency -->
    <mat-card
      appearance="outlined"
      class="flex flex-col rounded-2xl shadow-sm overflow-hidden col-span-1 md:col-span-2 xl:col-span-4"
    >
      <mat-card-header class="pb-2">
        <mat-card-title-group>
          <mat-card-title> Totals by currency </mat-card-title>
          <mat-card-subtitle> Net amount per currency code </mat-card-subtitle>
          <button
            mat-flat-button
            color="primary"
            class="flex items-center gap-1.5"
            (click)="openNewAdjustment()"
          >
            <mat-icon>currency_exchange</mat-icon>
            <span>Register Currency Exchange</span>
          </button>
        </mat-card-title-group>
      </mat-card-header>

      <mat-card-content class="flex-1 w-full pt-4">
        <div class="h-72 w-full">
          <app-currency-balance-graph></app-currency-balance-graph>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Card 2: Disparities / Distribution -->
    <mat-card
      appearance="outlined"
      class="flex flex-col rounded-2xl shadow-sm overflow-hidden col-span-1 md:col-span-2"
    >
      <mat-card-header class="pb-2">
        <mat-card-title>Volume Disparity</mat-card-title>
        <mat-card-subtitle>Percentage distribution</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content class="flex-1 w-full pt-4">
        <div class="h-72 w-full"></div>
      </mat-card-content>
    </mat-card>
    <!-- Card 3: Currencies over Time -->
    <mat-card
      appearance="outlined"
      class="flex flex-col rounded-2xl shadow-sm overflow-hidden col-span-1 md:col-span-2"
    >
      <mat-card-header class="pb-2">
        <mat-card-title>Currencies</mat-card-title>
        <mat-card-subtitle> Historical rate changes </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content class="flex-1 w-full pt-4">
        <div class="h-72 w-full">
          <app-historical-exchange-rate-graph></app-historical-exchange-rate-graph>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
